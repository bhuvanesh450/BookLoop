server.port=8080
spring.application.name=bookloop-backend

# MySQL connection; the backend falls back to H2 if MySQL is unavailable.
spring.datasource.url=${BOOKLOOP_DB_URL:jdbc:mysql://localhost:3306/bookloop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${BOOKLOOP_DB_USERNAME:root}
spring.datasource.password=${BOOKLOOP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Leave mail settings empty to use the local console OTP fallback.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${BOOKLOOP_MAIL_USERNAME:}
spring.mail.password=${BOOKLOOP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Supply a private, randomly generated secret of at least 32 bytes.
bookloop.jwt.secret=${BOOKLOOP_JWT_SECRET}
bookloop.jwt.expiration-ms=86400000
bookloop.otp.expiration-minutes=10

# Sample data is only created when an explicit password is provided.
bookloop.demo.password=${BOOKLOOP_DEMO_PASSWORD:}

logging.level.com.bookloop=INFO
logging.level.org.springframework.security=INFO
